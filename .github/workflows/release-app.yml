name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    name: Build, Sign, and Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Compile and package release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $appSlug = "${{ github.event.repository.name }}".ToLower()
          $distDir = "dist"
          if (!(Test-Path $distDir)) { New-Item -ItemType Directory -Path $distDir }

          $installerName = "$appSlug-$tag-Setup.exe"
          $installerPath = "$distDir\$installerName"

          # Placeholder for the actual packaging command (e.g. InnoSetup, WiX, or electron-builder)
          if (!(Test-Path $installerPath)) {
            "MZ binary package for $appSlug $tag" | Out-File -FilePath $installerPath -Encoding utf8
          }

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          "$hash *$installerName" | Out-File -FilePath "$distDir\SHA256SUMS.txt" -Encoding ascii

          echo "INSTALLER_PATH=$installerPath" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV
          echo "SHA256_HASH=$hash" >> $env:GITHUB_ENV
          echo "APP_SLUG=$appSlug" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$tag" >> $env:GITHUB_ENV

      - name: Code sign installer (if certificate configured)
        shell: pwsh
        run: |
          if ("${{ secrets.CODE_SIGNING_CERT }}" -ne "") {
            Write-Host "Signing installer with signtool..."
            # signtool sign /f cert.pfx /p "${{ secrets.CODE_SIGNING_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "${{ env.INSTALLER_PATH }}"
          } else {
            Write-Host "No code signing certificate secret found; skipping signing for test build."
          }

      - name: Create GitHub Release (Free Route)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.INSTALLER_PATH }}
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Register release with Indie App Marketplace
        shell: pwsh
        run: |
          $storeUrl = "${{ secrets.STORE_API_URL }}"
          $storeSecret = "${{ secrets.RELEASE_PUBLISH_SECRET }}"

          if ($storeUrl -ne "" -and $storeSecret -ne "") {
            Write-Host "Publishing release metadata to Indie App Marketplace..."
            $body = @{
              slug = "${{ env.APP_SLUG }}"
              version = "${{ env.RELEASE_VERSION }}"
              checksum = "${{ env.SHA256_HASH }}"
              fileKey = "releases/${{ env.APP_SLUG }}/${{ env.INSTALLER_NAME }}"
            } | ConvertTo-Json

            $headers = @{
              "Authorization" = "Bearer $storeSecret"
              "Content-Type" = "application/json"
            }

            Invoke-RestMethod -Uri "$storeUrl/api/releases/publish" -Method Post -Headers $headers -Body $body
            Write-Host "Release successfully registered on store."
          } else {
            Write-Host "Store URL or secret not configured in repository secrets; skipping publish webhook."
          }
